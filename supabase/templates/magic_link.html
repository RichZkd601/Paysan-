<h2>Votre lien de connexion</h2>
<p>Bonjour,</p>
<p>
  Cliquez sur le bouton ci-dessous pour vous connecter. Ce lien est valable une heure et ne peut
  servir qu'une fois.
</p>
<p>
  <a
    href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
    style="
      display: inline-block;
      padding: 12px 20px;
      background: #166534;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    "
  >
    Me connecter
  </a>
</p>
<p>Si vous n'êtes pas à l'origine de cette demande, ignorez simplement cet e-mail.</p>
